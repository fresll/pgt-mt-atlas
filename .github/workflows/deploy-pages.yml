name: Deploy to GitHub Pages

# Публичная индексация RU/EN разрешена куратором 2026-10-19.
# Settings → Pages → Source: GitHub Actions. Репозиторий публичный по решению куратора.
on:
  push:
    branches: [audit/v13-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/audit/v13-preview'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl pyyaml python-docx pytest
      - name: Validate source data and ETL
        working-directory: etl
        run: |
          python -m atlas_etl.build --check
          python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for existing e2e suite
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Build public four-language site with search indexing enabled
        env:
          ATLAS_BASE: /pgt-mt-atlas/
          ATLAS_SOFT_LAUNCH: '0'
          ATLAS_PUBLIC_LAUNCH: '1'
          ATLAS_CANONICAL_BASE: https://fresll.github.io/pgt-mt-atlas/
          VITE_ATLAS_PRIVATE_PREVIEW: '0'
          VITE_ATLAS_ENGLISH_PUBLIC: '1'
          VITE_ATLAS_CHINESE_PUBLIC: '1'
        run: npm run build
      - name: Verify public four-language navigation and English pages
        run: npm run e2e:public
      - name: Verify Chinese pages, interactive charts and navigation
        run: npx playwright test --config playwright.chinese.config.ts
      - name: Verify indexing, canonical URLs, language alternates and sitemap
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from html.parser import HTMLParser
          import re
          base = 'https://fresll.github.io/pgt-mt-atlas/'
          pages = list(Path('dist').rglob('*.html'))
          indexed = []
          class Head(HTMLParser):
              def __init__(self, html):
                  super().__init__(); self.links = []; self.feed(html)
              def handle_starttag(self, tag, attrs):
                  if tag == 'link': self.links.append(dict(attrs))
          for page in pages:
              html = page.read_text()
              path = page.relative_to('dist').as_posix()
              if path.startswith(('ru/', 'en/', 'es/', 'zh-Hans/')):
                  assert re.search(r'<meta\b[^>]*name="robots"[^>]*content="index, follow"', html), page
                  assert not re.search(r'<meta\b[^>]*name=[\"\x27]robots[\"\x27][^>]*content=[\"\x27][^\"\x27]*noindex', html, re.I), page
                  assert 'language-switch' in html and 'http-equiv="refresh"' not in html, page
                  links = Head(html).links
                  canonical = base + path.removesuffix('index.html')
                  assert [l['href'] for l in links if l.get('rel') == 'canonical'] == [canonical], page
                  expected = {lang: base + re.sub(r'^(ru|en|es|zh-Hans)/', lang+'/', path).removesuffix('index.html') for lang in ['ru', 'en', 'es', 'zh-Hans']}
                  assert {l['hreflang']: l['href'] for l in links if l.get('rel') == 'alternate'} == expected, page
                  indexed.append(canonical)
              else:
                  assert 'noindex' in html, page
          assert len(indexed) == 88, len(indexed)
          sitemap = ET.parse('dist/sitemap.xml')
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'x': 'http://www.w3.org/1999/xhtml'}
          urls = sitemap.findall('s:url', ns)
          assert len(urls) == 88
          assert {u.findtext('s:loc', namespaces=ns) for u in urls} == set(indexed)
          for entry in urls:
              location = entry.findtext('s:loc', namespaces=ns)
              assert {l.attrib['hreflang']: l.attrib['href'] for l in entry.findall('x:link', ns)} == {lang: re.sub(r'/(ru|en|es|zh-Hans)/', '/'+lang+'/', location, count=1) for lang in ['ru','en','es','zh-Hans']}
          assert Path('dist/robots.txt').read_text() == f'User-agent: *\nAllow: /\nSitemap: {base}sitemap.xml\n'
          print(f'PASS: {len(indexed)} indexable RU/EN/ES/ZH pages; reciprocal hreflang, canonical URLs and sitemap')
          PYTHON
      - name: Verify public visit count is available before deployment
        run: |
          python - <<'PY'
          import json, re
          from urllib.request import Request, urlopen
          request = Request('https://pgt-mt-atlas.goatcounter.com/counter/TOTAL.json',
                            headers={'Origin': 'https://fresll.github.io'})
          with urlopen(request, timeout=20) as response:
              count = json.load(response).get('count')
              assert isinstance(count, str) and re.fullmatch(r'\d[\d\s,.]*', count), 'Invalid public visit count'
              assert response.headers.get('Access-Control-Allow-Origin') in ['*', 'https://fresll.github.io'], 'Public count must allow browser access'
          print('PASS: anonymous total visit count and browser CORS access')
          PY
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Verify anonymous HTTPS indexing and sitemap after publication
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, re, tarfile, time
          from xml.etree import ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import PurePosixPath
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          from urllib.robotparser import RobotFileParser

          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          assert base == 'https://fresll.github.io/pgt-mt-atlas/', base
          def get(url, expected=200):
              for attempt in range(6):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'Atlas-deployment-check'}), timeout=20) as response:
                          assert response.status == expected, (url, response.status)
                          assert response.url.startswith(base), response.url
                          return response.read().decode('utf-8'), dict(response.headers)
                  except HTTPError as error:
                      if error.code == expected:
                          return error.read().decode('utf-8'), dict(error.headers)
                      if attempt == 5:
                          raise
                      time.sleep(5)
          class Head(HTMLParser):
              def __init__(self, html):
                  super().__init__(); self.links = []; self.feed(html)
              def handle_starttag(self, tag, attrs):
                  if tag == 'link': self.links.append(dict(attrs))
          with tarfile.open('pages-artifact/artifact.tar', 'r:*') as archive:
              pages = [PurePosixPath(m.name).as_posix() for m in archive.getmembers()
                       if m.isfile() and m.name.endswith('.html')]
          assert pages, 'No HTML in the deployed artifact'
          results = []
          for path in pages:
              url = urljoin(base, path.removesuffix('index.html') if path.endswith('index.html') else path)
              html, headers = get(url)
              indexable = path.startswith(('ru/', 'en/', 'es/', 'zh-Hans/'))
              expected_robots = 'index, follow' if indexable else ('noindex, follow' if path == 'index.html' else 'noindex')
              assert re.search(r'<meta\b[^>]*name="robots"[^>]*content="' + re.escape(expected_robots) + '"', html), url
              assert 'noindex' not in (headers.get('X-Robots-Tag') or '').lower(), url
              if indexable:
                  assert not re.search(r'<meta\b[^>]*name=[\"\x27]robots[\"\x27][^>]*content=[\"\x27][^\"\x27]*noindex', html, re.I), url
                  links = Head(html).links
                  assert [l['href'] for l in links if l.get('rel') == 'canonical'] == [url], url
                  assert {l['hreflang']: l['href'] for l in links if l.get('rel') == 'alternate'} == {lang: re.sub(r'/(ru|en|es|zh-Hans)/', '/'+lang+'/', url, count=1) for lang in ['ru','en','es','zh-Hans']}, url
              assert 'text/html' in headers.get('Content-Type', ''), (url, headers.get('Content-Type'))
              if path == 'ru/index.html':
                  assert 'https://gc.zgo.at/count.js' in html, 'Counter script is missing'
              if path.startswith(('ru/', 'en/', 'es/', 'zh-Hans/')):
                  assert 'class="visitor-count"' in html, ('Visible visit counter is missing', url)
                  assert 'language-switch' in html, ('Language switch is missing', url)
                  assert 'http-equiv="refresh"' not in html, ('Unexpected language redirect', url)
              results.append({'url': url, 'status': 200, 'robots': expected_robots,
                              'headers': {k: headers.get(k) for k in
                                          ['Content-Type', 'X-Robots-Tag', 'Strict-Transport-Security', 'Server']}})
          robots, _ = get(urljoin(base, 'robots.txt'))
          assert robots == f'User-agent: *\nAllow: /\nSitemap: {base}sitemap.xml\n', robots
          sitemap, _ = get(urljoin(base, 'sitemap.xml'))
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'x': 'http://www.w3.org/1999/xhtml'}
          entries = ET.fromstring(sitemap).findall('s:url', ns)
          indexed = {p['url'] for p in results if p['robots'] == 'index, follow'}
          assert len(entries) == len(indexed) == 88
          assert {e.findtext('s:loc', namespaces=ns) for e in entries} == indexed
          for entry in entries:
              location = entry.findtext('s:loc', namespaces=ns)
              assert {l.attrib['hreflang']: l.attrib['href'] for l in entry.findall('x:link', ns)} == {lang: re.sub(r'/(ru|en|es|zh-Hans)/', '/'+lang+'/', location, count=1) for lang in ['ru','en','es','zh-Hans']}, location
          origin = urlsplit(base)
          root_robots = f'{origin.scheme}://{origin.netloc}/robots.txt'
          try:
              with urlopen(root_robots, timeout=20) as response:
                  parser = RobotFileParser()
                  parser.parse(response.read().decode('utf-8').splitlines())
                  for bot in ['Googlebot', 'bingbot', 'YandexBot']:
                      for lang in ['ru', 'en', 'es', 'zh-Hans']:
                          assert parser.can_fetch(bot, base + lang + '/'), (root_robots, bot, lang)
          except HTTPError as error:
              assert error.code == 404, (root_robots, error.code)
          print(json.dumps({'anonymous_https': True, 'pages': results,
                            'robots_allow': True, 'sitemap_status': 200, 'indexed_pages': len(indexed)}, ensure_ascii=False))
          PY
