name: Deploy to GitHub Pages (soft launch)

# Публичный доступ разрешён куратором; поисковая индексация пока запрещена.
# Settings → Pages → Source: GitHub Actions. Репозиторий публичный по решению куратора.
on:
  push:
    branches: [audit/v13-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/audit/v13-preview'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl pyyaml python-docx pytest
      - name: Validate source data and ETL
        working-directory: etl
        run: |
          python -m atlas_etl.build --check
          python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for existing e2e suite
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Build public site with search indexing disabled
        env:
          ATLAS_BASE: /pgt-mt-atlas/
          ATLAS_SOFT_LAUNCH: '1'
          ATLAS_PUBLIC_LAUNCH: '0'
          VITE_ATLAS_PRIVATE_PREVIEW: '0'
        run: npm run build
      - name: Verify noindex in generated HTML and crawler access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pages = list(Path('dist').rglob('*.html'))
          assert pages, 'No HTML generated'
          for page in pages:
              html = page.read_text()
              assert '<meta name="robots" content="noindex, follow">' in html, page
              assert not re.search(r'<meta\b[^>]*name=[\"\x27]robots[\"\x27][^>]*content=[\"\x27]index\b', html, re.I), page
          assert Path('dist/robots.txt').read_text().strip() == 'User-agent: *\nAllow: /'
          assert not list(Path('dist').rglob('*sitemap*')), 'Unexpected sitemap'
          print(f'PASS: {len(pages)} HTML pages have noindex; crawler access allowed')
          PY
      - name: Verify public visit count is available before deployment
        run: |
          python - <<'PY'
          import json, re
          from urllib.request import Request, urlopen
          request = Request('https://pgt-mt-atlas.goatcounter.com/counter/TOTAL.json',
                            headers={'Origin': 'https://fresll.github.io'})
          with urlopen(request, timeout=20) as response:
              count = json.load(response).get('count')
              assert isinstance(count, str) and re.fullmatch(r'\d[\d\s,.]*', count), 'Invalid public visit count'
              assert response.headers.get('Access-Control-Allow-Origin') in ['*', 'https://fresll.github.io'], 'Public count must allow browser access'
          print('PASS: anonymous total visit count and browser CORS access')
          PY
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact
      - name: Verify anonymous HTTPS pages and noindex after publication
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, tarfile, time
          from pathlib import PurePosixPath
          from urllib.error import HTTPError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          from urllib.robotparser import RobotFileParser

          base = os.environ['PAGES_URL'].rstrip('/') + '/'
          assert base == 'https://fresll.github.io/pgt-mt-atlas/', base
          def get(url, expected=200):
              for attempt in range(6):
                  try:
                      with urlopen(Request(url, headers={'User-Agent': 'Atlas-deployment-check'}), timeout=20) as response:
                          assert response.status == expected, (url, response.status)
                          assert response.url.startswith(base), response.url
                          return response.read().decode('utf-8'), dict(response.headers)
                  except HTTPError as error:
                      if error.code == expected:
                          return error.read().decode('utf-8'), dict(error.headers)
                      if attempt == 5:
                          raise
                      time.sleep(5)
          with tarfile.open('pages-artifact/artifact.tar', 'r:*') as archive:
              pages = [PurePosixPath(m.name).as_posix() for m in archive.getmembers()
                       if m.isfile() and m.name.endswith('.html')]
          assert pages, 'No HTML in the deployed artifact'
          results = []
          for path in pages:
              url = urljoin(base, path.removesuffix('index.html') if path.endswith('index.html') else path)
              html, headers = get(url)
              assert '<meta name="robots" content="noindex, follow">' in html, url
              assert 'text/html' in headers.get('Content-Type', ''), (url, headers.get('Content-Type'))
              if path == 'ru/index.html':
                  assert 'https://gc.zgo.at/count.js' in html, 'Counter script is missing'
              if path.startswith('ru/'):
                  assert 'class="visitor-count"' in html, ('Visible visit counter is missing', url)
              results.append({'url': url, 'status': 200, 'robots': 'noindex, follow',
                              'headers': {k: headers.get(k) for k in
                                          ['Content-Type', 'X-Robots-Tag', 'Strict-Transport-Security', 'Server']}})
          robots, _ = get(urljoin(base, 'robots.txt'))
          assert robots.strip() == 'User-agent: *\nAllow: /', robots
          get(urljoin(base, 'sitemap.xml'), expected=404)
          origin = urlsplit(base)
          root_robots = f'{origin.scheme}://{origin.netloc}/robots.txt'
          try:
              with urlopen(root_robots, timeout=20) as response:
                  parser = RobotFileParser()
                  parser.parse(response.read().decode('utf-8').splitlines())
                  assert parser.can_fetch('Googlebot', base + 'ru/'), 'Root robots.txt blocks Googlebot'
          except HTTPError as error:
              assert error.code == 404, (root_robots, error.code)
          print(json.dumps({'anonymous_https': True, 'pages': results,
                            'robots_allow': True, 'sitemap_status': 404}, ensure_ascii=False))
          PY
