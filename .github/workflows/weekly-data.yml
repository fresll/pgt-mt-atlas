name: Weekly data release

# Еженедельно перегенерирует данные сайта из текущей сопроводительной таблицы.
# Если выгрузка изменилась — открывает PR с отчётом. Автослияния нет.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl pyyaml python-docx pytest
      - name: Build dataset
        working-directory: etl
        run: |
          python -m pytest -q
          python -m atlas_etl.build | tee ../etl-report.txt
      - name: Detect changes (ignoring the version date)
        id: diff
        run: |
          if git diff --quiet -I '"dataset_version"' -- site/public/data site/src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -c core.quotepath=off diff --stat -- site/public/data site/src/data >> etl-report.txt
          fi
      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data-release/$(date -u +%Y-%m-%d)"
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add site/public/data site/src/data
          git commit -m "Data release $(date -u +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --title "Data release $(date -u +%Y-%m-%d)" --body-file etl-report.txt --label data-change || \
            gh pr create --title "Data release $(date -u +%Y-%m-%d)" --body-file etl-report.txt
