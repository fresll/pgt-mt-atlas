# Контролируемые словари. Исходная строка из xlsx всегда сохраняется рядом с кодом (поля *_raw).
# Каждая исходная строка должна быть сопоставлена явно — иначе ETL падает.
# Сопоставление консервативное: если стадия из строки не следует, ставится `unspecified`.

labels:
  stage:
    cleavage:    {ru: Стадия дробления, en: Cleavage stage}
    morula:      {ru: Морула, en: Morula}
    blastocyst:  {ru: Бластоциста, en: Blastocyst}
    arrested:    {ru: Остановившийся / дегенерирующий эмбрион, en: Arrested / degenerating embryo}
    unspecified: {ru: Стадия не указана в наборе, en: Stage not specified in dataset}
  sample_type:
    te_biopsy:              {ru: Биоптат ТЭ, en: TE biopsy}
    te_icm_multiple:        {ru: Несколько биоптатов ТЭ и ВКМ (среднее), en: Multiple TE and ICM biopsies (mean)}
    single_blastomeres:     {ru: Одиночные бластомеры, en: Single blastomeres}
    multiple_blastomeres:   {ru: Несколько бластомеров, en: Multiple blastomeres}
    blastomeres_unspecified: {ru: Бластомер(ы), en: Blastomere(s)}
    half_embryo:            {ru: Половина эмбриона, en: Half embryo}
    whole_embryo:           {ru: Эмбрион целиком, en: Whole embryo}
    mixed_unspecified:      {ru: Бластомеры и/или эмбрион (не уточнено), en: Blastomeres and/or whole embryo (unspecified)}
  fraction:
    te_biopsy:     {ru: Биоптат ТЭ, en: TE biopsy}
    icm:           {ru: ВКМ, en: ICM}
    remaining_te:  {ru: Оставшаяся ТЭ, en: Remaining TE}
  tissue:
    amniotic_fluid: {ru: Амниотическая жидкость, en: Amniotic fluid}
    fetal_tissue:   {ru: Ткани плода, en: Fetal tissues}
    cord_blood:     {ru: Пуповинная кровь, en: Cord blood}
    blood:          {ru: Кровь, en: Blood}
    urine:          {ru: Моча, en: Urine}
    buccal:         {ru: Буккальный эпителий, en: Buccal epithelium}
  phase:
    prenatal:  {ru: Пренатальный, en: Prenatal}
    postnatal: {ru: Постнатальный, en: Postnatal}
  qualifier:
    exact:        {ru: Точное значение, en: Exact value}
    not_detected: {ru: Не выявлено методом, en: Not detected by the method}
    less_than:    {ru: Меньше указанного значения, en: Below the stated value}
    interval:     {ru: Опубликован только интервал, en: Only an interval was published}
  derivation:
    as_reported_in_dataset:  {ru: Как в наборе данных (правило вывода не записано), en: As in the dataset (no derivation rule recorded)}
    mean_of_blastomeres:     {ru: Среднее двух бластомеров, en: Mean of two blastomeres}
    mean_of_halves:          {ru: Среднее двух половин эмбриона, en: Mean of two embryo halves}
    mean_of_biopsies:        {ru: Среднее нескольких биоптатов, en: Mean of several biopsies}
    digitized_from_figure:   {ru: Снято с рисунка первоисточника, en: Read from a figure of the source}
    via_secondary_review:    {ru: Взято из обзоров (первоисточник — тезисы), en: Taken from reviews (primary source is an abstract)}
  variant_class:
    pathogenic:             {ru: Патогенный вариант, en: Pathogenic variant}
    uncertain_significance: {ru: Вариант неопределённого значения, en: Variant of uncertain significance}
    neutral_polymorphism:   {ru: Нейтральный полиморфизм, en: Neutral polymorphism}

