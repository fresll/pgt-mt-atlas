thresholds:
- id: t18
  value: 18
  role: study_estimate
  publication: hellebrekers2012
  locator: Hum Reprod Update 2012;18(4):341–349, абстракт (PubMed 22456975), раздел Results
  checked: '2026-10-11 по абстракту PubMed. Полного текста нет ни в репозитории, ни в PMC: состав выборки и исключения сверены
    только в объёме абстракта.'
  ru: 'Расчётный ориентир систематического обзора: уровень мутации ≤18% в мышечной ткани связан с вероятностью ≥95% остаться
    непоражённым (159 точковых вариантов мтДНК; семейные данные 137 родословных; априорная доля поражённых 0,477). Для m.3243A>G
    вероятность остаться непоражённым ниже. Оценка получена не на эмбрионах и не является порогом для биоптата эмбриона.'
  en: 'Calculated estimate from a systematic review: a muscle mutation level of ≤18% is associated with a ≥95% chance of being
    unaffected (159 mtDNA point variants; familial data from 137 pedigrees; a priori probability of being affected 0.477).
    For m.3243A>G the chance of being unaffected is lower. The estimate was not derived from embryos and is not a threshold
    for an embryo biopsy.'
- id: t15_30
  range:
  - 15
  - 30
  role: literature_range
  publication: ji2023
  locator: J Assist Reprod Genet 2023;40:2185–2196, с. 2190 (Results) и с. 2193 (Discussion); у авторов — ссылка [23]
  checked: 2026-10-11 по PDF (references/Ji et al 2023 PGTmt risk and chance.pdf)
  ru: Диапазон симптоматического порога m.3243A>G, который Ji и соавт. приводят как общепринятый со ссылкой на литературу;
    собственный порог для m.3243A>G по своим данным авторы определить не смогли.
  en: Range of the symptomatic threshold for m.3243A>G that Ji et al. cite as generally accepted from the literature; the
    authors could not determine a threshold for m.3243A>G from their own data.
- id: t30
  value: 30
  role: programme_criterion
  publication: hyslop2025
  locator: 'N Engl J Med 2025, Methods (с. 3 PDF: «single blastomere was removed on day 3»; «less than 30% heteroplasmy»)
    и с. 5 PDF'
  checked: 2026-10-11 по PDF (references/Hyslop et al 2025 MRT PGTmt.pdf)
  ru: 'Рабочий критерий программы Newcastle: для переноса или витрификации преимущественно использовали эмбрионы с гетероплазмией
    менее 30%, измеренной в одном бластомере 3-го дня. Это критерий конкретной клинической программы, а не универсальная граница.'
  en: 'Working criterion of the Newcastle programme: embryos with less than 30% heteroplasmy, measured in a single day-3 blastomere,
    were preferentially used for transfer or vitrification. It is the criterion of one clinical programme, not a universal
    threshold.'
