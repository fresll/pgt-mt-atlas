# Правила, перенесённые из скриптов рисунков (figures/originals/Исходники рисунков/*.py)
# и из пояснений сопроводительной таблицы. Каждое правило вывода значения ссылается на ячейку xlsx,
# где оно записано. Без такой ссылки значение получает derivation = as_reported_in_dataset.

derivation_rules:
  - publication: sallevelt2017
    material_raw: 'single blastomeres, diagnostic analysis'
    derivation: mean_of_blastomeres
    evidence: "«Таблица 1»!H13: «расчёт по первоисточнику: среднее пары бластомеров»"
  - publication: spath2021
    variant: m.3243A>G
    material_raw: 'half embryo'
    derivation: mean_of_halves
    evidence: "«Таблица 1»!H19: «значения по эмбрионам пересчитаны как среднее двух половин»"
  - publication: heindryckx2014
    derivation: mean_of_biopsies
    evidence: "«Таблица 1»!H11: «средние значения по 11 бластоцистам»"
  - publication: mizuguchi2025
    derivation: digitized_from_figure
    evidence: "«Таблица 1»!H20: «рис. 2A первоисточника: значения сняты с графика»"
  - publication: thorburn2009
    derivation: via_secondary_review
    evidence: "«Таблица 1»!H5: значения по сводкам Castelluccio 2025 и Smeets 2023"

# Пределы обнаружения, записанные в таблице (не выводятся по умолчанию)
lod_rules:
  - publication: hu2026
    lod_pct: 1.0
    evidence: "«Рисунок 3»!I184 и «Таблица 1»!H33: «0 = ниже порога 1,0%»"
  - publication: monnot2011
    sheet: Бластомеры (дробление)
    lod_pct: 2.0
    evidence: "«Бластомеры (дробление)»!A2: «Порог детекции метода в первоисточнике — 2%»"

# Рисунок 3: порядок блоков (вариантов) и столбцов (источников) — из Рисунок_3.py::BLOCKS
fig3_blocks:
  - variant: m.3243A>G
    sources: [monnot2011, spath2021, treff2012, heindryckx2014, hyslop2025]
  - variant: m.14487T>C
    sources: [sallevelt2017, tofilo2026]
  - variant: m.8993T>G
    sources: [spath2021, steffann2006, hyslop2025, thorburn2009]
  - variant: m.3697G>A
    sources: [ji2021]
  - variant: m.10197G>A
    sources: [mizuguchi2025]
  - variant: m.10191T>C
    sources: [spath2021]
  - variant: m.3250T>C
    sources: [hu2026]

# Рисунок 6: варианты, показанные в статье (Рисунок_6.py::VARIANTS)
fig6_variants: [m.8993T>G, m.3243A>G, m.14487T>C, m.3697G>A]

# Ориентиры (не клинические пороги)
thresholds:
  - id: t18
    value: 18
    publication: hellebrekers2012
    ru: Расчётная граница ≥95% вероятности остаться бессимптомным по совокупности точковых вариантов (мышечная ткань)
    en: Calculated bound for ≥95% probability of remaining asymptomatic across point variants (muscle tissue)
  - id: t15_30
    range: [15, 30]
    publication: ji2023
    ru: Литературный диапазон симптоматического порога m.3243A>G
    en: Literature range of the symptomatic threshold for m.3243A>G
  - id: t30
    value: 30
    publication: hyslop2025
    ru: Операционный критерий отбора эмбрионов в программе Newcastle
    en: Operational embryo-selection criterion of the Newcastle programme
  - id: lod1
    value: 1
    publication: null
    ru: Условный предел обнаружения (линия на рисунке 3)
    en: Nominal detection limit (line on Figure 3)
  - id: high70
    value: 70
    publication: null
    ru: Условная граница высокой нагрузки (зона на рисунке 3)
    en: Nominal high-load zone (Figure 3)

# Параметры модели рисунка 6 (лист «Рисунок 6» и подпись к рис. 6)
model:
  p_eupl:
    - {age: 30, value: 0.7}
    - {age: 35, value: 0.5}
    - {age: 40, value: 0.3}
  p_eupl_publication: volodyaev2025
  p_eupl_locator: null   # точное место в источнике — вопрос В6 к авторам
  n_max: 8
