  p_eupl_publication: volodyaev2025
  p_eupl_status: scenario
  p_eupl_locator: 'Volodyaev et al. 2025, F S Rev 6:100082, doi:10.1016/j.xfnr.2024.100082: с. 2, раздел «Incidence, parental
    origin, and age relation» (анеуплоидии целых хромосом 20–30% в 25–35 лет, почти линейный рост ≈6% в год после 35 лет,
    80–90% в 42–44 года); с. 3, рис. 2 (доля эуплоидных бластоцист по возрасту, данные Franasiak et al.); значения E — сценарные,
    с точками рисунка не сопоставлены'
  p_eupl_note:
    ru: 'Сценарные значения E = 0,7 / 0,5 / 0,3. Volodyaev et al. 2025: анеуплоидии целых хромосом 20–30% в 25–35 лет, рост
      около 6% в год после 35, 80–90% в 42–44 года; рис. 2 показывает возрастную зависимость эуплоидии. Сценарии не привязаны
      к возрасту и не сопоставлены с точками рисунка.'
    en: 'Scenario E values 0.7 / 0.5 / 0.3. Volodyaev et al. 2025: whole-chromosome aneuploidy 20–30% at 25–35 years, about
      6% annual increase after 35, 80–90% at 42–44; Figure 2 shows age-related euploidy. These scenarios are not assigned
      to ages or matched to figure points.'
