# Основания классификации вариантов (раздел 7 задания раунда 1).
#
# Класс варианта берётся из сопроводительной таблицы обзора (vocab.yaml → variant_class); здесь записано, на чём он
# основан. Atlas не вводит собственный классификатор (в том числе по уровню гетероплазмии).
# status:
#   stated_in_source   — в первичной публикации набора есть явное утверждение о классе; дан локатор;
#   implied_in_source  — публикация относит вариант к патогенным косвенно (в общем утверждении); дан локатор;
#   not_verified       — явного утверждения в доступных PDF не найдено; класс — по сопроводительной таблице.
# Базы MITOMAP и ClinVar из среды сборки недоступны (сетевая политика); сверка с ними — открытый вопрос.
checked: '2026-10-11'
variants:
  m.3243A>G:
    class: pathogenic
    status: stated_in_source
    publication: spath2021
    locator: 'PDF с. 8: «Unlike many other pathogenic mtDNA mutations, m.3243A>G heteroplasmy
      levels are poorly predictive…»'
  m.14487T>C:
    class: pathogenic
    status: stated_in_source
    publication: tofilo2026
    locator: Tofilo et al., 2026, основной текст, Introduction — pathogenic mtDNA
      variant m.14487T>C; doi:10.1007/s10815-026-04012-y, PMID 42649365.
  m.8993T>G:
    class: pathogenic
    status: implied_in_source
    publication: spath2021
    locator: 'PDF с. 9: «clear differences in transmission patterns between pathogenic
