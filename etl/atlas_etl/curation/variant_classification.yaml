# Основания классификации вариантов (раздел 7 задания раунда 1).
#
# Класс варианта берётся из сопроводительной таблицы обзора (vocab.yaml → variant_class); здесь записано, на чём он
# основан. Atlas не вводит собственный классификатор (в том числе по уровню гетероплазмии).
# status:
#   stated_in_source   — в первичной публикации набора есть явное утверждение о классе; дан локатор;
#   implied_in_source  — публикация относит вариант к патогенным косвенно (в общем утверждении); дан локатор;
#   not_verified       — явного утверждения в доступных PDF не найдено; класс — по сопроводительной таблице.
# Базы MITOMAP и ClinVar из среды сборки недоступны (сетевая политика); сверка с ними — открытый вопрос.
checked: '2026-10-11'
variants:
  'm.3243A>G':
    class: pathogenic
    status: stated_in_source
    publication: spath2021
    locator: 'PDF с. 8: «Unlike many other pathogenic mtDNA mutations, m.3243A>G heteroplasmy levels are poorly predictive…»'
  'm.14487T>C':
    class: pathogenic
    status: stated_in_source
    publication: tofilo2026
    locator: >-
      Рукопись Tofilo et al. (references/Tofilo et al 2026 PGTmt 14487.pdf), с. 1: «carrying the pathogenic mtDNA variant
      m.14487T>C». В абстракте опубликованной версии (PubMed 42649365) класс не назван; окончательный текст статьи
      в репозитории отсутствует.
  'm.8993T>G':
    class: pathogenic
    status: implied_in_source
    publication: spath2021
    locator: 'PDF с. 9: «clear differences in transmission patterns between pathogenic mutations… m.8993T>G…»'
  'm.3697G>A':
    class: pathogenic
    status: implied_in_source
    publication: ji2021
    locator: 'PDF с. 7: «the inheritance of different pathogenic mtDNA mutations… previous analysis has not included m.3697G>A»'
  'm.10197G>A':
    class: pathogenic
    status: stated_in_source
    publication: mizuguchi2025
    locator: 'PDF с. 1: «The m.10197G>A mutation… is a rare pathogenic mutation of Leigh encephalopathy»'
  'm.10191T>C':
    class: pathogenic
    status: not_verified
    publication: spath2021
    locator: null
  'm.3250T>C':
    class: uncertain_significance
    status: stated_in_source
    publication: hu2026
    locator: >-
      PDF с. 3: «the variant is annotated as a variant of uncertain significance (VUS) due to incomplete penetrance and
      likely benign in silico predictions» (у авторов — ссылки на MITOMAP и Wong et al.)
  'm.8344A>G':
    class: pathogenic
    status: not_verified
    publication: rubens2025
    locator: null
  'm.8993T>C':
    class: pathogenic
    status: not_verified
    publication: rubens2025
    locator: null
  'HV2 polymorphism':
    class: neutral_polymorphism
    status: not_verified
    publication: rubens2025
    locator: null
