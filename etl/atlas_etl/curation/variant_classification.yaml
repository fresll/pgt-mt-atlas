  m.3697G>A:
    class: pathogenic
    status: implied_in_source
    publication: ji2021
    locator: 'PDF с. 7: «the inheritance of different pathogenic mtDNA mutations…
      previous analysis has not included m.3697G>A»'
  m.10197G>A:
    class: pathogenic
    status: stated_in_source
    publication: mizuguchi2025
    locator: 'PDF с. 1: «The m.10197G>A mutation… is a rare pathogenic mutation of
      Leigh encephalopathy»'
  m.10191T>C:
    class: pathogenic
    status: not_verified
    publication: spath2021
    locator: null
  m.3250T>C:
