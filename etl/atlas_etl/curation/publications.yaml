# Кураторские метаданные публикаций, на которые ссылаются записи набора данных.
#
# Правила:
#  * Библиографическое описание и DOI берутся из списка литературы рукописи
#    (review_references.yaml, поле review_ref_no). DOI здесь НЕ дублируется: ETL берёт его из рукописи
#    и падает, если поле `doi_override` расходится с ним без объяснения.
#  * `aliases` — точные строки, которыми публикация обозначена в листах xlsx (столбцы «Источник»).
#  * `pmid`, `published_date` заполняются только после проверки (поле `verified`).
#  * Ничего не дополняется по памяти: неизвестное = null.
#
# pub_status: published | in_press | conference_abstract | preprint

